<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AHA Agent</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">AHA</span>
        <span class="logo-sub">Agent</span>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-label" id="statusLabel">Idle</span>
      </div>
    </header>

    <!-- Main form -->
    <main class="main-form" id="mainForm">

      <!-- Slot 1: Platform -->
      <div class="form-group">
        <label class="form-label" for="platformInput">
          Platform
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="platformInput"
          class="form-input"
          placeholder="e.g. LinkedIn, Instagram, X"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <!-- Slot 2: Text (Yes / No) -->
      <div class="form-group">
        <label class="form-label">Include Text</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="textChoice" value="yes" id="textYes" />
            <span class="radio-custom"></span>
            Yes
          </label>
          <label class="radio-label">
            <input type="radio" name="textChoice" value="no" id="textNo" checked />
            <span class="radio-custom"></span>
            No
          </label>
        </div>
      </div>

      <!-- Slot 3: Media (None / Image / Video) -->
      <div class="form-group">
        <label class="form-label">Media</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="mediaType" value="none" id="mediaNone" checked />
            <span class="radio-custom"></span>
            None
          </label>
          <label class="radio-label">
            <input type="radio" name="mediaType" value="Image" id="mediaImage" />
            <span class="radio-custom"></span>
            Image
          </label>
          <label class="radio-label">
            <input type="radio" name="mediaType" value="Video" id="mediaVideo" />
            <span class="radio-custom"></span>
            Video
          </label>
        </div>
      </div>

      <!-- Run button -->
      <button class="btn btn-primary btn-run" id="runBtn">
        <span class="btn-icon">▶</span>
        <span>Run Agent</span>
      </button>

      <!-- Execution log -->
      <div class="log-panel" id="logPanel" hidden>
        <div class="log-title">Execution Log</div>
        <div class="log-content" id="logContent"></div>
      </div>

      <!-- Downloads section -->
      <div class="downloads-section">
        <div class="section-title">📦 Downloads</div>
        <a class="btn btn-download" id="dlVault" href="https://aha-cloud-brain.onrender.com/AHA-Storage-Vault.zip" target="_blank">
          ⬇ Storage Vault Template
        </a>
        <a class="btn btn-download" id="dlContent" href="https://aha-cloud-brain.onrender.com/AHA-Content-Engine.zip" target="_blank">
          ⬇ Content Engine
        </a>
      </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-ws" id="footerWs">Backend: —</span>
      <a href="https://aha-cloud-brain.onrender.com/legal" target="_blank" class="footer-terms">Terms</a>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>

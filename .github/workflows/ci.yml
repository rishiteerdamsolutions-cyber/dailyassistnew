name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Silence Node 20 deprecation warning on checkout/setup-python (see GitHub changelog).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1 \
            libgomp1 \
            xvfb \
            scrot \
            python3-tk

      - name: Install Python dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Replace GUI OpenCV wheel (needs libGL on Linux) with headless build for CI.
          pip install --force-reinstall opencv-python-headless

      - name: Verify imports
        env:
          DISPLAY: ":99"
        run: |
          set -euxo pipefail
          # pyautogui (imported transitively by m9_social) needs an X display on Linux.
          xvfb-run -a python -c "import cv2, pyautogui; from bol.config import BOLConfig; from aha.billing import PLANS; print('imports ok')"

      - name: Run tests
        env:
          DISPLAY: ":99"
        run: |
          set -euxo pipefail
          xvfb-run -a python -m pytest tests/ -q --tb=short
